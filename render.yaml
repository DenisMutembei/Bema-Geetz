services:
  - type: web
    name: bema-geetz-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    # Persistent storage for uploads (images/videos)
    disk:
      name: uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bema-geetz-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app
      - key: WHATSAPP_NUMBER
        value: "254700000000"
      - key: PORT
        value: "10000"  # Render uses port 10000 by default

databases:
  - name: bema-geetz-db
    databaseName: bemageetz
    user: bemageetz
    plan: free

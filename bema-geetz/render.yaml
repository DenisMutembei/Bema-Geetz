services:
  - type: web
    name: bema-geetz-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bema-geetz-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app
      - key: WHATSAPP_NUMBER
        value: "254700000000"

databases:
  - name: bema-geetz-db
    databaseName: bemageetz
    user: bemageetz
    plan: free
